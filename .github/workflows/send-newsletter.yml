name: Publish Adding Spark-le Newsletter

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r adding-spark-le/requirements.txt

      - name: Generate today's newsletter
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python adding-spark-le/main.py

      - name: Commit and push the updated page
        run: |
          git config user.name "adding-spark-le-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Publish newsletter for $(date +'%Y-%m-%d')"
          git push
