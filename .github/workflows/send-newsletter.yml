name: Publish Adding Spark-le Newsletter

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern (Standard Time) / 6:00 AM Central.
    # Cron doesn't auto-shift for Daylight Saving Time — nudge the hour
    # twice a year if you want it locked to local clock time.
    # 1-5 = Monday-Friday only.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the generated page back to the repo

jobs:
  publish-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's newsletter
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit and push the updated page
        run: |
          git config user.name "adding-spark-le-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Publish newsletter for $(date +'%Y-%m-%d')"
          git push
